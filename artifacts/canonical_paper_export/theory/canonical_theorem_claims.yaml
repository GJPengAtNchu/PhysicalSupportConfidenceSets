schema_version: M0B_CANONICAL_THEOREM_CLAIMS_V1
paper_title: "Physical-Support Confidence Sets for Highly Coherent Dictionaries"
evidence_layer: exact_fixed_dimensional_theory
claims:
  - claim_id: "T01"
    exact_wording: "The inferential target is the marked set of active physical rays modulo sign and child relabeling, not the coordinate support in one fitted dictionary."
    claim_type: "interpretation"
    scope_qualifier: "Fixed-dimensional supplied local collision model"
    prohibited_stronger_wording: "The fitted coordinate support is always physically meaningless."
    source_members:
      - "sections/03_problem.tex"
  - claim_id: "T02"
    exact_wording: "The exact cross-dictionary confidence correspondence has conditional test coverage at least 1-alpha_T with probability at least 1-alpha_D over training."
    claim_type: "theorem"
    scope_qualifier: "Unknown-p fixed-shell class and certified training rectangle"
    prohibited_stronger_wording: "The empirical controller inherits this exact conditional coverage theorem."
    source_members:
      - "sections/04_method.tex"
      - "sections/05_main_results.tex"
  - claim_id: "T03"
    exact_wording: "Residual child orientation enters the latent training law at cubic order in s and has nuisance-profiled information of order s^6."
    claim_type: "theorem"
    scope_qualifier: "Fixed exchangeable or Bernoulli-Gaussian law under frozen-shell assumptions"
    prohibited_stronger_wording: "All dictionary-learning problems have an Ns^6 sample complexity."
    source_members:
      - "sections/05_main_results.tex"
      - "appendices/A_main_proofs.tex"
  - claim_id: "T04"
    exact_wording: "The parent, support, and dictionary gates are governed by I_G^(r), I_S, and I_D=Ns^6, with no NT product gate asserted."
    claim_type: "theorem"
    scope_qualifier: "Supplied fixed-shell train-test experiment"
    prohibited_stronger_wording: "These three formulas govern every sparse-representation application."
    source_members:
      - "sections/05_main_results.tex"
  - claim_id: "T05"
    exact_wording: "After the parent and support gates open, the minimax physical resolution is s wedge 1/(sqrt(N)s^2) up to constants."
    claim_type: "theorem"
    scope_qualifier: "Constant-factor fixed-shell resolved regime"
    prohibited_stronger_wording: "A matching upper bound holds throughout every transition band or for unknown s."
    source_members:
      - "sections/05_main_results.tex"
      - "appendices/A_main_proofs.tex"
  - claim_id: "T06"
    exact_wording: "The dictionary-gate lower bound persists when an oracle reveals the hierarchy, shell, sheet, support, coefficients, noise levels, and all nonorientation nuisance parameters."
    claim_type: "theorem"
    scope_qualifier: "Centered-core compensated path"
    prohibited_stronger_wording: "Unknown hierarchy or scale is irrelevant in all models."
    source_members:
      - "sections/05_main_results.tex"
      - "appendices/A_main_proofs.tex"
  - claim_id: "T07"
    exact_wording: "For general r the task conclusion is local efficient information; a finite matching train-test rate is proved only on the declared one-dimensional orbit."
    claim_type: "theorem"
    scope_qualifier: "Centered core plus the stated orbit and secant assumptions"
    prohibited_stronger_wording: "A global finite general-r task theorem."
    source_members:
      - "sections/05_main_results.tex"
      - "appendices/A_main_proofs.tex"
  - claim_id: "T08"
    exact_wording: "For two active atoms, nonzero amplitude contrast opens a profiled test secant, while the equal-coefficient compensated slice is test-invariant for every T."
    claim_type: "theorem"
    scope_qualifier: "Declared two-atom orbit and coefficient shell"
    prohibited_stronger_wording: "More test replication always resolves dictionary uncertainty."
    source_members:
